name: AI Daily News Afternoon Review

on:
  workflow_dispatch:
    inputs:
      send_email:
        description: "Send the reviewed issue to the afternoon audience"
        required: true
        type: boolean
        default: true
      send_files:
        description: "Run file upload before optional email delivery"
        required: true
        type: boolean
        default: false
  schedule:
    # 北京时间(UTC+8);提前定时补偿 GitHub 延迟,依赖 morning 已发布(内置等待+幂等)
    - cron: "30 4 * * *"  # 12:30 北京
    - cron: "0 5 * * *"   # 13:00 北京

concurrency:
  group: ai-daily-news-afternoon
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  review-and-send:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TZ: Asia/Shanghai
      CONTENT_BASE_URL: https://${{ github.repository_owner }}.github.io/ai-daily-news-workflow

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve issue date
        id: issue
        run: echo "date=$(TZ=Asia/Shanghai date +%F)" >> "$GITHUB_OUTPUT"

      - name: Check out published content
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published-site

      - name: Check afternoon delivery marker
        id: delivery
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            SENT=$(python3 scripts/delivery_marker.py check \
              --site-dir published-site \
              --date "${{ steps.issue.outputs.date }}" \
              --phase afternoon)
          else
            SENT=false
          fi
          echo "skip=$SENT" >> "$GITHUB_OUTPUT"
          echo "Afternoon already sent: $SENT"

      - name: Check published morning issue
        if: ${{ steps.delivery.outputs.skip != 'true' }}
        env:
          AI_DAILY_SMTP_USER: ${{ secrets.AI_DAILY_SMTP_USER }}
          AI_DAILY_SMTP_PASSWORD: ${{ secrets.AI_DAILY_SMTP_PASSWORD }}
        run: |
          ISSUE_URL="$CONTENT_BASE_URL/api/issues/${{ steps.issue.outputs.date }}/manifest.json"
          STATUS=$(curl -L -s -o /tmp/morning-manifest.json -w "%{http_code}" "$ISSUE_URL")
          if [ "$STATUS" != "200" ]; then
            REASON="Morning issue manifest is missing or unreachable: status=$STATUS"
            echo "::error::$REASON"
            python3 scripts/send_admin_alert.py \
              --date "${{ steps.issue.outputs.date }}" \
              --phase afternoon \
              --reason "$REASON" \
              --issue-url "$ISSUE_URL" || echo "::warning::Failed to send admin alert"
            exit 1
          fi
          if ! READY_OUTPUT=$(python3 scripts/check_manifest_ready.py /tmp/morning-manifest.json 2>&1); then
            REASON="Morning issue manifest is not ready: $READY_OUTPUT"
            echo "::error::$REASON"
            python3 scripts/send_admin_alert.py \
              --date "${{ steps.issue.outputs.date }}" \
              --phase afternoon \
              --reason "$REASON" \
              --issue-url "$ISSUE_URL" || echo "::warning::Failed to send admin alert"
            exit 1
          fi
          echo "Morning issue is published: $ISSUE_URL"
          exit 0

      - name: Set up Python
        if: ${{ steps.delivery.outputs.skip != 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download and independently review published issue
        if: ${{ steps.delivery.outputs.skip != 'true' }}
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENCODE_GO_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_LLM_BASE_URL: https://integrate.api.nvidia.com/v1
          NVIDIA_LLM_MODELS: deepseek-ai/deepseek-v4-pro,moonshotai/kimi-k2.6,z-ai/glm-5.2
          OPENCODE_GO_BASE_URL: https://integrate.api.nvidia.com/v1
          OPENCODE_GO_MODELS: deepseek-ai/deepseek-v4-pro,moonshotai/kimi-k2.6,z-ai/glm-5.2
          OPENCODE_GO_TIMEOUT_SECONDS: "600"
          LLM_STREAM: "true"
          LENOVO_LLM_API_KEY: ${{ secrets.LENOVO_LLM_API_KEY || secrets.AI_DAILY_LENOVO_LLM_API_KEY }}
          LENOVO_LLM_BASE_URL: ${{ vars.LENOVO_LLM_BASE_URL || 'https://aicloud-app.lenovo.com.cn/qwen35-122b-a10b-fp8/v1' }}
          LENOVO_LLM_MODELS: ${{ vars.LENOVO_LLM_MODELS || 'qwen35-122b-a10b-fp8' }}
        run: |
          test -n "$LENOVO_LLM_API_KEY" || test -n "$NVIDIA_API_KEY" || { echo "::error::Missing GitHub Actions secret LENOVO_LLM_API_KEY or NVIDIA_API_KEY"; exit 1; }
          python3 scripts/prepare_review_delivery.py \
            --date "${{ steps.issue.outputs.date }}" \
            --base-url "$CONTENT_BASE_URL" \
            --output-dir review-dist \
            --review-warn-only

      - name: Alert admins when afternoon review blocks delivery
        if: ${{ failure() && steps.delivery.outputs.skip != 'true' }}
        env:
          AI_DAILY_SMTP_USER: ${{ secrets.AI_DAILY_SMTP_USER }}
          AI_DAILY_SMTP_PASSWORD: ${{ secrets.AI_DAILY_SMTP_PASSWORD }}
        run: |
          REASON="Afternoon review failed before delivery."
          REPORT="review-dist/quality-review-${{ steps.issue.outputs.date }}.json"
          if [ -f "$REPORT" ]; then
            REASON=$(python3 scripts/summarize_review_block.py "$REPORT")
          fi
          python3 scripts/send_admin_alert.py \
            --date "${{ steps.issue.outputs.date }}" \
            --phase afternoon \
            --reason "$REASON" \
            --issue-url "$CONTENT_BASE_URL/api/issues/${{ steps.issue.outputs.date }}/manifest.json" || echo "::warning::Failed to send admin alert"

      - name: Restore afternoon delivery progress
        if: ${{ steps.delivery.outputs.skip != 'true' }}
        run: |
          STATUS="published-site/state/delivery-progress/${{ steps.issue.outputs.date }}/afternoon.json"
          if [ -f "$STATUS" ]; then
            cp "$STATUS" "review-dist/delivery-status-afternoon-${{ steps.issue.outputs.date }}.json"
            echo "Restored afternoon delivery progress: $STATUS"
          else
            echo "No previous afternoon delivery progress"
          fi

      - name: Run deterministic quality gate again
        if: ${{ steps.delivery.outputs.skip != 'true' }}
        run: |
          python3 skill/scripts/check_and_distribute.py \
            --date "${{ steps.issue.outputs.date }}" \
            --artifact-dir review-dist \
            --dry-run

      - name: Verify recipient delivery plan
        if: ${{ steps.delivery.outputs.skip != 'true' }}
        env:
          AI_DAILY_SMTP_USER: ${{ secrets.AI_DAILY_SMTP_USER }}
          AI_DAILY_SMTP_PASSWORD: ${{ secrets.AI_DAILY_SMTP_PASSWORD }}
        run: |
          python3 skill/scripts/send_all.py \
            --date "${{ steps.issue.outputs.date }}" \
            --artifact-dir review-dist \
            --phase afternoon \
            --dry-run

      - name: 文件上传
        if: ${{ steps.delivery.outputs.skip != 'true' && (github.event_name == 'schedule' || inputs.send_files) }}
        env:
          AI_DAILY_PRE_SEND_API_URL: ${{ secrets.AI_DAILY_PRE_SEND_API_URL || vars.AI_DAILY_PRE_SEND_API_URL }}
        run: |
          set +e
          python3 scripts/upload_delivery_artifacts.py \
            --date "${{ steps.issue.outputs.date }}"
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 0 ]; then
            echo "::warning::File upload failed with exit code $STATUS; continuing to email delivery"
            {
              echo "### 文件上传"
              echo
              echo "- Status: warning"
              echo "- Exit code: $STATUS"
              echo "- Delivery continues: yes"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### 文件上传"
              echo
              echo "- Status: success"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Send reviewed issue
        if: ${{ steps.delivery.outputs.skip != 'true' && (github.event_name == 'schedule' || inputs.send_email) }}
        env:
          AI_DAILY_SMTP_USER: ${{ secrets.AI_DAILY_SMTP_USER }}
          AI_DAILY_SMTP_PASSWORD: ${{ secrets.AI_DAILY_SMTP_PASSWORD }}
        run: |
          python3 skill/scripts/send_all.py \
            --date "${{ steps.issue.outputs.date }}" \
            --artifact-dir review-dist \
            --phase afternoon

      - name: Publish afternoon delivery progress
        if: ${{ always() && steps.delivery.outputs.skip != 'true' && (github.event_name == 'schedule' || inputs.send_email) }}
        run: |
          STATUS_FILE="review-dist/delivery-status-afternoon-${{ steps.issue.outputs.date }}.json"
          if [ ! -f "$STATUS_FILE" ]; then
            echo "No afternoon delivery progress file"
            exit 0
          fi
          mkdir -p "published-site/state/delivery-progress/${{ steps.issue.outputs.date }}"
          cp "$STATUS_FILE" "published-site/state/delivery-progress/${{ steps.issue.outputs.date }}/afternoon.json"
          cd published-site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "state/delivery-progress/${{ steps.issue.outputs.date }}/afternoon.json"
          if git diff --cached --quiet; then
            echo "No afternoon delivery progress changes"
          else
            git commit -m "Update afternoon delivery progress ${{ steps.issue.outputs.date }}"
            git push origin HEAD:gh-pages
          fi

      - name: Publish review report and delivery marker
        if: ${{ success() && steps.delivery.outputs.skip != 'true' && (github.event_name == 'schedule' || inputs.send_email) }}
        run: |
          mkdir -p "published-site/reviews/${{ steps.issue.outputs.date }}"
          cp "review-dist/quality-review-${{ steps.issue.outputs.date }}.json" \
            "published-site/reviews/${{ steps.issue.outputs.date }}/afternoon.json"
          python3 scripts/delivery_marker.py mark \
            --site-dir published-site \
            --date "${{ steps.issue.outputs.date }}" \
            --phase afternoon \
            --run-id "${{ github.run_id }}"
          cd published-site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reviews/ state/
          git commit -m "Publish afternoon review ${{ steps.issue.outputs.date }}"
          git push origin HEAD:gh-pages

      - name: Write workflow summary
        if: always()
        run: |
          AUDIENCE=$(python3 -c "import json, pathlib; print(json.loads(pathlib.Path('skill/references/send-email-config.json').read_text(encoding='utf-8'))['phases']['afternoon']['audience'])")
          RECIPIENTS=$(python3 -c "import json, pathlib, sys; print(', '.join(json.loads(pathlib.Path('skill/references/recipients.json').read_text(encoding='utf-8'))[sys.argv[1]]))" "$AUDIENCE")
          {
            echo "## AI Daily News afternoon review"
            echo
            echo "- Date: ${{ steps.issue.outputs.date }}"
            echo "- Phase: \`afternoon\`"
            echo "- Audience: \`$AUDIENCE\`"
            echo "- Recipients: \`$RECIPIENTS\`"
            echo "- File upload requested: ${{ github.event_name == 'schedule' || inputs.send_files }}"
            echo "- Skipped by idempotency marker: ${{ steps.delivery.outputs.skip }}"
            echo "- Email requested: ${{ github.event_name == 'schedule' || inputs.send_email }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-daily-news-review-${{ steps.issue.outputs.date }}
          path: review-dist/
          if-no-files-found: warn
          retention-days: 14

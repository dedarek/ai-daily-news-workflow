name: Upload AI Daily News To New Site

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Issue date to upload, YYYY-MM-DD. Empty means today in Asia/Shanghai."
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Shanghai

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve issue date
        id: issue
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            DATE="${{ inputs.date }}"
          else
            DATE="$(TZ=Asia/Shanghai date +%F)"
          fi
          if ! echo "$DATE" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "::error::Invalid date: $DATE"
            exit 1
          fi
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "Upload date: $DATE"

      - name: Check out published content
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published-site

      - name: Verify published artifacts
        run: |
          DATE="${{ steps.issue.outputs.date }}"
          test -f "published-site/api/issues/$DATE/articles.json"
          test -f "published-site/api/issues/$DATE/pipeline-report.json"
          test -f "published-site/audio/$DATE.mp3"
          test -f "published-site/video/$DATE.mp4"

      - name: Upload artifacts to new site
        id: upload_new_site
        env:
          AI_DAILY_NEW_SITE_API_KEY: ${{ secrets.AI_DAILY_NEW_SITE_API_KEY }}
          AI_DAILY_NEW_SITE_ENDPOINT: ${{ vars.AI_DAILY_NEW_SITE_ENDPOINT || 'http://47.108.192.42:4000/daily' }}
        run: |
          DATE="${{ steps.issue.outputs.date }}"
          test -n "$AI_DAILY_NEW_SITE_API_KEY" || { echo "::error::Missing GitHub Actions secret AI_DAILY_NEW_SITE_API_KEY"; exit 1; }
          node scripts/upload_new_site_artifacts.mjs \
            --date "$DATE" \
            --artifact-dir upload-dist \
            --articles "published-site/api/issues/$DATE/articles.json" \
            --report "published-site/api/issues/$DATE/pipeline-report.json" \
            --audio "published-site/audio/$DATE.mp3" \
            --video "published-site/video/$DATE.mp4" \
            --endpoint "$AI_DAILY_NEW_SITE_ENDPOINT"

      - name: Upload new-site text artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-daily-news-new-site-text-${{ steps.issue.outputs.date }}
          path: upload-dist/daily-news-text-${{ steps.issue.outputs.date }}.txt
          if-no-files-found: warn
          retention-days: 14

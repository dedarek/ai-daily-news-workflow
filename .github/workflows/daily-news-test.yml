name: AI Daily News Morning

on:
  workflow_dispatch:
    inputs:
      send_email:
        description: "Send the result using the morning phase in send-email-config.json"
        required: true
        type: boolean
        default: true
      force_regenerate:
        description: "Force regenerate today's materials even if gh-pages already has a ready issue"
        required: true
        type: boolean
        default: true
  schedule:
    # 北京时间(UTC+8);一个 fallback + delivery_marker 幂等,补偿 GitHub 定时延迟,只发一次
    - cron: "51 0 * * *"  # 8:51 北京
    - cron: "51 1 * * *"  # 9:51 北京
    - cron: "10 3 * * *"  # 11:10 北京,临时补救

concurrency:
  group: ai-daily-news-morning
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-validate-send:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Asia/Shanghai

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve issue date
        id: issue
        run: echo "date=$(TZ=Asia/Shanghai date +%F)" >> "$GITHUB_OUTPUT"

      - name: Check out published content
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published-site

      - name: Check morning delivery marker
        id: delivery
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            SENT=$(python3 scripts/delivery_marker.py check \
              --site-dir published-site \
              --date "${{ steps.issue.outputs.date }}" \
              --phase morning)
          else
            SENT=false
          fi
          echo "skip=$SENT" >> "$GITHUB_OUTPUT"
          echo "Morning already sent: $SENT"

      - name: Set up Python
        if: ${{ steps.delivery.outputs.skip != 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install media dependency
        if: ${{ steps.delivery.outputs.skip != 'true' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        if: ${{ steps.delivery.outputs.skip != 'true' }}
        run: python -m pip install -r requirements.txt

      - name: Run source smoke tests
        if: ${{ steps.delivery.outputs.skip != 'true' }}
        run: ./scripts/smoke_test.sh

      - name: Run news agent and build artifacts
        if: ${{ steps.delivery.outputs.skip != 'true' }}
        env:
          AI_DAILY_VIDEO_API_TOKEN: ${{ secrets.AI_DAILY_VIDEO_API_TOKEN || vars.AI_DAILY_VIDEO_API_TOKEN }}
          AI_DAILY_VIDEO_API_BASE_URL: ${{ vars.AI_DAILY_VIDEO_API_BASE_URL || 'http://8.137.39.142:8011/video-api/api' }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENCODE_GO_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_LLM_BASE_URL: https://integrate.api.nvidia.com/v1
          NVIDIA_LLM_MODELS: deepseek-ai/deepseek-v4-pro,moonshotai/kimi-k2.6,z-ai/glm-5.2
          OPENCODE_GO_BASE_URL: https://integrate.api.nvidia.com/v1
          OPENCODE_GO_MODELS: deepseek-ai/deepseek-v4-pro,moonshotai/kimi-k2.6,z-ai/glm-5.2
          OPENCODE_GO_TIMEOUT_SECONDS: "600"
          LLM_STREAM: "true"
          LENOVO_LLM_API_KEY: ${{ secrets.LENOVO_LLM_API_KEY || secrets.AI_DAILY_LENOVO_LLM_API_KEY }}
          LENOVO_LLM_BASE_URL: ${{ vars.LENOVO_LLM_BASE_URL || 'https://aicloud-app.lenovo.com.cn/qwen35-122b-a10b-fp8/v1' }}
          LENOVO_LLM_MODELS: ${{ vars.LENOVO_LLM_MODELS || 'qwen35-122b-a10b-fp8' }}
        run: |
          test -n "$LENOVO_LLM_API_KEY" || test -n "$NVIDIA_API_KEY" || { echo "::error::Missing GitHub Actions secret LENOVO_LLM_API_KEY or NVIDIA_API_KEY"; exit 1; }
          test -n "$AI_DAILY_VIDEO_API_TOKEN" || { echo "::error::Missing GitHub Actions secret AI_DAILY_VIDEO_API_TOKEN"; exit 1; }
          FORCE_ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            FORCE_ARGS="--force-regenerate"
            rm -rf dist
          fi
          echo "FORCE_ARGS=$FORCE_ARGS"
          python3 scripts/run_news_agent.py \
            --date "${{ steps.issue.outputs.date }}" \
            --output-dir dist \
            --published-site-dir published-site \
            $FORCE_ARGS

      - name: Run complete quality gate
        if: ${{ steps.delivery.outputs.skip != 'true' }}
        run: |
          python3 skill/scripts/check_and_distribute.py \
            --date "${{ steps.issue.outputs.date }}" \
            --artifact-dir dist \
            --dry-run

      - name: Verify recipient delivery plan
        if: ${{ steps.delivery.outputs.skip != 'true' }}
        env:
          AI_DAILY_SMTP_USER: ${{ secrets.AI_DAILY_SMTP_USER }}
          AI_DAILY_SMTP_PASSWORD: ${{ secrets.AI_DAILY_SMTP_PASSWORD }}
        run: |
          python3 skill/scripts/send_all.py \
            --date "${{ steps.issue.outputs.date }}" \
            --artifact-dir dist \
            --phase morning \
            --dry-run

      - name: Update public content API
        if: ${{ steps.delivery.outputs.skip != 'true' }}
        run: |
          python3 scripts/build_content_site.py \
            --date "${{ steps.issue.outputs.date }}" \
            --dist-dir dist \
            --site-dir published-site \
            --base-url "https://${{ github.repository_owner }}.github.io/ai-daily-news-workflow"

      - name: Publish content API
        if: ${{ steps.delivery.outputs.skip != 'true' }}
        run: |
          cd published-site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No content changes"
          else
            git commit -m "Publish AI daily news ${{ steps.issue.outputs.date }}"
            git push origin HEAD:gh-pages
          fi

      - name: Send admin email
        if: ${{ steps.delivery.outputs.skip != 'true' && (github.event_name == 'schedule' || inputs.send_email) }}
        env:
          AI_DAILY_SMTP_USER: ${{ secrets.AI_DAILY_SMTP_USER }}
          AI_DAILY_SMTP_PASSWORD: ${{ secrets.AI_DAILY_SMTP_PASSWORD }}
        run: |
          test -n "$AI_DAILY_SMTP_USER"
          test -n "$AI_DAILY_SMTP_PASSWORD"
          python3 skill/scripts/send_all.py \
            --date "${{ steps.issue.outputs.date }}" \
            --artifact-dir dist \
            --phase morning

      - name: Mark morning delivery
        if: ${{ success() && steps.delivery.outputs.skip != 'true' && (github.event_name == 'schedule' || inputs.send_email) }}
        run: |
          python3 scripts/delivery_marker.py mark \
            --site-dir published-site \
            --date "${{ steps.issue.outputs.date }}" \
            --phase morning \
            --run-id "${{ github.run_id }}"
          cd published-site
          git add state/
          git commit -m "Mark morning delivery ${{ steps.issue.outputs.date }}"
          git push origin HEAD:gh-pages

      - name: Write workflow summary
        if: always()
        run: |
          AUDIENCE=$(python3 -c "import json, pathlib; print(json.loads(pathlib.Path('skill/references/send-email-config.json').read_text(encoding='utf-8'))['phases']['morning']['audience'])")
          RECIPIENTS=$(python3 -c "import json, pathlib, sys; print(', '.join(json.loads(pathlib.Path('skill/references/recipients.json').read_text(encoding='utf-8'))[sys.argv[1]]))" "$AUDIENCE")
          {
            echo "## AI Daily News test"
            echo
            echo "- Date: ${{ steps.issue.outputs.date }}"
            echo "- Phase: \`morning\`"
            echo "- Audience: \`$AUDIENCE\`"
            echo "- Recipients: \`$RECIPIENTS\`"
            echo "- Content mode: DeepAgent-backed material workflow"
            echo "- Force regenerate: ${{ github.event_name == 'workflow_dispatch' }}"
            echo "- Email requested: ${{ github.event_name == 'schedule' || inputs.send_email }}"
            echo "- Skipped by idempotency marker: ${{ steps.delivery.outputs.skip }}"
            echo "- Content API: https://${{ github.repository_owner }}.github.io/ai-daily-news-workflow/api/latest.json"
            echo
            echo "Artifacts contain the generated HTML, MP3, MP4, JSON report, articles, and podcast script."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload generated artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-daily-news-${{ steps.issue.outputs.date }}
          path: dist/
          if-no-files-found: warn
          retention-days: 14

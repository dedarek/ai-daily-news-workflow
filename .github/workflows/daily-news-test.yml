name: AI Daily News Test

on:
  workflow_dispatch:
    inputs:
      send_email:
        description: "Send the result to the single test recipient"
        required: true
        type: boolean
        default: true
  schedule:
    - cron: "30 3 * * *"

concurrency:
  group: ai-daily-news-test
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-validate-send:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Shanghai
      TEST_RECIPIENT: yyc54321@126.com

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install media dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Resolve issue date
        id: issue
        run: echo "date=$(TZ=Asia/Shanghai date +%F)" >> "$GITHUB_OUTPUT"

      - name: Run source smoke tests
        run: ./scripts/smoke_test.sh

      - name: Collect live news and build artifacts
        env:
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
          OPENCODE_GO_BASE_URL: https://opencode.ai/zen/go/v1
          OPENCODE_GO_MODEL: deepseek-v4-pro
        run: |
          python3 scripts/run_live_pipeline.py \
            --date "${{ steps.issue.outputs.date }}" \
            --output-dir dist

      - name: Run complete quality gate
        run: |
          python3 skill/scripts/check_and_distribute.py \
            --date "${{ steps.issue.outputs.date }}" \
            --dry-run

      - name: Verify single-recipient delivery plan
        env:
          AI_DAILY_SMTP_USER: ${{ secrets.AI_DAILY_SMTP_USER }}
          AI_DAILY_SMTP_PASSWORD: ${{ secrets.AI_DAILY_SMTP_PASSWORD }}
        run: |
          python3 skill/scripts/send_all.py \
            --date "${{ steps.issue.outputs.date }}" \
            --dry-run

      - name: Send test email
        if: ${{ github.event_name == 'schedule' || inputs.send_email }}
        env:
          AI_DAILY_SMTP_USER: ${{ secrets.AI_DAILY_SMTP_USER }}
          AI_DAILY_SMTP_PASSWORD: ${{ secrets.AI_DAILY_SMTP_PASSWORD }}
        run: |
          test -n "$AI_DAILY_SMTP_USER"
          test -n "$AI_DAILY_SMTP_PASSWORD"
          python3 skill/scripts/send_all.py \
            --date "${{ steps.issue.outputs.date }}"

      - name: Write workflow summary
        if: always()
        run: |
          {
            echo "## AI Daily News test"
            echo
            echo "- Date: ${{ steps.issue.outputs.date }}"
            echo "- Recipient: \`$TEST_RECIPIENT\`"
            echo "- Content mode: live collection"
            echo "- Email requested: ${{ github.event_name == 'schedule' || inputs.send_email }}"
            echo
            echo "Artifacts contain the generated HTML, MP3, and JSON report."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload generated artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-daily-news-${{ steps.issue.outputs.date }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

name: AI Daily News Morning

on:
  workflow_dispatch:
    inputs:
      send_email:
        description: "Send the result using the morning phase in send-email-config.json"
        required: true
        type: boolean
        default: true
      force_regenerate:
        description: "Force regenerate today's materials even if gh-pages already has a ready issue"
        required: true
        type: boolean
        default: true
  schedule:
    # 北京时间(UTC+8)每天(含周末);不回退旧日期
    - cron: "51 0 * * *"  # 9:51 北京

concurrency:
  group: ai-daily-news-private-delivery
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-validate-send:
    if: ${{ vars.AI_DAILY_PRIVATE_DELIVERY_READY == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      issue_date: ${{ steps.issue.outputs.date }}
      skipped: ${{ steps.delivery.outputs.skip }}
    env:
      TZ: Asia/Shanghai
      AI_DAILY_PRIVATE_STATE_DIR: ${{ github.workspace }}/private-delivery

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify private delivery destination
        env:
          GH_TOKEN: ${{ secrets.AI_DAILY_PRIVATE_STATE_TOKEN }}
          STATE_REPO: ${{ vars.AI_DAILY_PRIVATE_STATE_REPO }}
        run: |
          set -eu
          [[ "$STATE_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          test "$STATE_REPO" != "$GITHUB_REPOSITORY"
          test -n "$GH_TOKEN"
          test "$(gh api "repos/$STATE_REPO" --jq '.private and .visibility == "private" and .default_branch == "main"')" = true

      - name: Check out private delivery storage
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.AI_DAILY_PRIVATE_STATE_REPO }}
          token: ${{ secrets.AI_DAILY_PRIVATE_STATE_TOKEN }}
          ref: main
          path: private-delivery
          fetch-depth: 1

      - name: Validate private roster
        run: |
          test -f private-delivery/migration-complete
          git -C private-delivery config user.name "github-actions[bot]"
          git -C private-delivery config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 -c "from pathlib import Path; from scripts.verify_public_news import recipients; recipients(Path('private-delivery/recipients.json'))"

      - name: Resolve issue date
        id: issue
        run: echo "date=$(TZ=Asia/Shanghai date +%F)" >> "$GITHUB_OUTPUT"

      - name: Check out published content
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published-site

      - name: Check morning delivery marker
        id: delivery
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            SENT=$(python3 scripts/delivery_marker.py check \
              --site-dir private-delivery \
              --date "${{ steps.issue.outputs.date }}" \
              --phase morning)
          else
            SENT=false
          fi
          echo "skip=$SENT" >> "$GITHUB_OUTPUT"
          echo "Morning already sent: $SENT"

      - name: Set up Python
        if: ${{ steps.delivery.outputs.skip != 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate video API credentials
        if: ${{ steps.delivery.outputs.skip != 'true' }}
        continue-on-error: true
        env:
          AI_DAILY_VIDEO_API_TOKEN: ${{ secrets.AI_DAILY_VIDEO_API_TOKEN }}
          AI_DAILY_VIDEO_API_BASE_URL: ${{ secrets.AI_DAILY_VIDEO_API_BASE_URL || vars.AI_DAILY_VIDEO_API_BASE_URL }}
        run: |
          if [ -z "$AI_DAILY_VIDEO_API_TOKEN" ]; then
            echo "::warning::Missing AI_DAILY_VIDEO_API_TOKEN; pipeline will fall back to text-only issue"
            exit 0
          fi
          python3 scripts/check_video_api.py

      - name: Install media dependency
        if: ${{ steps.delivery.outputs.skip != 'true' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        if: ${{ steps.delivery.outputs.skip != 'true' }}
        run: python -m pip install -r requirements.txt

      - name: Run source smoke tests
        if: ${{ steps.delivery.outputs.skip != 'true' }}
        run: ./scripts/smoke_test.sh > "$RUNNER_TEMP/news-smoke.log" 2>&1

      - name: Run news agent and build artifacts
        if: ${{ steps.delivery.outputs.skip != 'true' }}
        env:
          AI_DAILY_VIDEO_API_TOKEN: ${{ secrets.AI_DAILY_VIDEO_API_TOKEN }}
          AI_DAILY_VIDEO_API_BASE_URL: ${{ secrets.AI_DAILY_VIDEO_API_BASE_URL || vars.AI_DAILY_VIDEO_API_BASE_URL }}
          OPENCODE_GO_TIMEOUT_SECONDS: "600"
          LLM_STREAM: "true"
          LENOVO_LLM_API_KEY: ${{ secrets.LENOVO_LLM_API_KEY || secrets.AI_DAILY_LENOVO_LLM_API_KEY }}
          LENOVO_LLM_BASE_URL: ${{ secrets.LENOVO_LLM_BASE_URL || vars.LENOVO_LLM_BASE_URL }}
        run: |
          test -n "$LENOVO_LLM_API_KEY" || { echo "::error::Missing GitHub Actions secret LENOVO_LLM_API_KEY"; exit 1; }
          FORCE_ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            FORCE_ARGS="--force-regenerate"
            rm -rf dist
          fi
          echo "FORCE_ARGS=$FORCE_ARGS"
          { python3 scripts/run_news_agent.py \
            --date "${{ steps.issue.outputs.date }}" \
            --output-dir dist \
            --published-site-dir published-site \
            $FORCE_ARGS; } > "$RUNNER_TEMP/news-private.log" 2>&1 || { echo '::error::Newsletter step failed; raw diagnostics withheld'; exit 1; }

      - name: Alert on individual news source failures
        if: ${{ always() && steps.delivery.outputs.skip != 'true' }}
        continue-on-error: true
        env:
          AI_DAILY_SMTP_USER: ${{ secrets.AI_DAILY_SMTP_USER }}
          AI_DAILY_SMTP_PASSWORD: ${{ secrets.AI_DAILY_SMTP_PASSWORD }}
        run: |
          HEALTH_FILE="dist/source-health-${{ steps.issue.outputs.date }}.json"
          if [ -f "$HEALTH_FILE" ]; then
            { python3 scripts/send_source_health_alert.py \
              --date "${{ steps.issue.outputs.date }}" \
              --health-report "$HEALTH_FILE"; } > "$RUNNER_TEMP/news-private.log" 2>&1 || { echo '::error::Newsletter step failed; raw diagnostics withheld'; exit 1; }
          else
            echo "::warning::Source health report was not produced"
          fi

      - name: Run complete quality gate
        if: ${{ steps.delivery.outputs.skip != 'true' }}
        run: |
          python3 skill/scripts/check_and_distribute.py \
            --date "${{ steps.issue.outputs.date }}" \
            --artifact-dir dist \
            --dry-run

      - name: Verify recipient delivery plan
        if: ${{ steps.delivery.outputs.skip != 'true' }}
        env:
          AI_DAILY_SMTP_USER: ${{ secrets.AI_DAILY_SMTP_USER }}
          AI_DAILY_SMTP_PASSWORD: ${{ secrets.AI_DAILY_SMTP_PASSWORD }}
        run: |
          { python3 skill/scripts/send_all.py \
            --date "${{ steps.issue.outputs.date }}" \
            --artifact-dir dist \
            --phase morning \
            --dry-run; } > "$RUNNER_TEMP/news-private.log" 2>&1 || { echo '::error::Newsletter step failed; raw diagnostics withheld'; exit 1; }

      - name: Update public content API
        if: ${{ steps.delivery.outputs.skip != 'true' }}
        run: |
          { python3 scripts/build_content_site.py \
            --date "${{ steps.issue.outputs.date }}" \
            --dist-dir dist \
            --site-dir published-site \
            --base-url "https://${{ github.repository_owner }}.github.io/ai-daily-news-workflow"; } > "$RUNNER_TEMP/news-private.log" 2>&1 || { echo '::error::Newsletter step failed; raw diagnostics withheld'; exit 1; }

      - name: Publish content API
        if: ${{ steps.delivery.outputs.skip != 'true' }}
        env:
          AI_DAILY_SMTP_USER: ${{ secrets.AI_DAILY_SMTP_USER }}
          LENOVO_LLM_BASE_URL: ${{ secrets.LENOVO_LLM_BASE_URL || vars.LENOVO_LLM_BASE_URL }}
          AI_DAILY_VIDEO_API_BASE_URL: ${{ secrets.AI_DAILY_VIDEO_API_BASE_URL || vars.AI_DAILY_VIDEO_API_BASE_URL }}
          AI_DAILY_PRE_SEND_API_URL: ${{ secrets.AI_DAILY_PRE_SEND_API_URL || vars.AI_DAILY_PRE_SEND_API_URL }}
        run: |
          cd published-site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .nojekyll 404.html index.html feed.json api html audio video voice podcast-dialogue
          python3 ../scripts/verify_public_news.py .
          if git diff --cached --quiet; then
            echo "No content changes"
          else
            git commit -m "Publish AI daily news ${{ steps.issue.outputs.date }}"
            git push origin HEAD:gh-pages
          fi

      - name: Send admin email
        if: ${{ steps.delivery.outputs.skip != 'true' && (github.event_name == 'schedule' || inputs.send_email) }}
        env:
          AI_DAILY_SMTP_USER: ${{ secrets.AI_DAILY_SMTP_USER }}
          AI_DAILY_SMTP_PASSWORD: ${{ secrets.AI_DAILY_SMTP_PASSWORD }}
        run: |
          test -n "$AI_DAILY_SMTP_USER"
          test -n "$AI_DAILY_SMTP_PASSWORD"
          { python3 skill/scripts/send_all.py \
            --date "${{ steps.issue.outputs.date }}" \
            --artifact-dir dist \
            --phase morning; } > "$RUNNER_TEMP/news-private.log" 2>&1 || { echo '::error::Newsletter step failed; raw diagnostics withheld'; exit 1; }

      - name: Mark delivery complete in private storage
        if: ${{ success() && steps.delivery.outputs.skip != 'true' && (github.event_name == 'schedule' || inputs.send_email) }}
        run: |
          python3 scripts/delivery_marker.py mark --site-dir private-delivery --date "${{ steps.issue.outputs.date }}" --phase morning --run-id "${{ github.run_id }}"
          python3 -c "from pathlib import Path; from scripts.private_delivery_git import checkpoint; checkpoint(Path('private-delivery/state/deliveries/${{ steps.issue.outputs.date }}/morning.json'))"

      - name: Write workflow summary
        if: always()
        run: |
          AUDIENCE=$(python3 -c "import json, pathlib; print(json.loads(pathlib.Path('skill/references/send-email-config.json').read_text(encoding='utf-8'))['phases']['morning']['audience'])")
          {
            echo "## AI Daily News test"
            echo
            echo "- Date: ${{ steps.issue.outputs.date }}"
            echo "- Phase: \`morning\`"
            echo "- Audience: \`$AUDIENCE\`"
            echo "- Content mode: DeepAgent-backed material workflow"
            echo "- Force regenerate: ${{ github.event_name == 'workflow_dispatch' }}"
            echo "- Email requested: ${{ github.event_name == 'schedule' || inputs.send_email }}"
            echo "- Skipped by idempotency marker: ${{ steps.delivery.outputs.skip }}"
            echo "- Content API: https://${{ github.repository_owner }}.github.io/ai-daily-news-workflow/api/latest.json"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

  upload-new-site:
    needs: build-validate-send
    if: ${{ needs.build-validate-send.result == 'success' && needs.build-validate-send.outputs.skipped != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Shanghai
      AI_DAILY_PRIVATE_STATE_DIR: ${{ github.workspace }}/private-delivery

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out published content
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published-site

      - name: Upload morning artifacts to new site
        id: upload_new_site
        env:
          AI_DAILY_NEW_SITE_API_KEY: ${{ secrets.AI_DAILY_NEW_SITE_API_KEY }}
          AI_DAILY_NEW_SITE_ENDPOINT: ${{ vars.AI_DAILY_NEW_SITE_ENDPOINT || 'http://47.108.192.42:4000/daily' }}
        run: |
          DATE="${{ needs.build-validate-send.outputs.issue_date }}"
          test -n "$AI_DAILY_NEW_SITE_API_KEY" || { echo "::error::Missing GitHub Actions secret AI_DAILY_NEW_SITE_API_KEY"; exit 1; }
          node scripts/upload_new_site_artifacts.mjs \
            --date "$DATE" \
            --artifact-dir upload-dist \
            --articles "published-site/api/issues/$DATE/articles.json" \
            --report "published-site/api/issues/$DATE/pipeline-report.json" \
            --audio "published-site/audio/$DATE.mp3" \
            --video "published-site/video/$DATE.mp4" \
            --endpoint "$AI_DAILY_NEW_SITE_ENDPOINT" > "$RUNNER_TEMP/news-mirror.log" 2>&1

